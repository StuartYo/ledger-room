<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger Room</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect x="5" y="4" width="22" height="24" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 11h12M10 16h12M10 21h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="23" cy="22" r="5" fill="var(--stamp)"/><path d="M21 22l1.5 1.5L25 21" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
    <div>
      <h1>Ledger Room</h1>
      <p class="tag" data-i18n="tag"></p>
    </div>
  </div>
  <div class="pills">
    <span class="pill ok" data-i18n-title="localTip">
      <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span data-i18n="local"></span></span>
    <span class="pill" id="modelPill"></span>
    <span class="pill" id="userPill" hidden></span>
    <span class="pill" id="maskPill" data-i18n-title="maskTip"></span>
    <button class="pill linkbtn" id="unmaskBtn" hidden data-i18n-title="unmaskTip"></button>
    <button class="pill linkbtn" id="langBtn"></button>
    <button class="pill linkbtn" id="logoutBtn" hidden data-i18n="logout"></button>
  </div>
</header>

<div class="offline" id="offline" role="status" hidden>
  <svg viewBox="0 0 24 24"><path d="M1 1l22 22M16.7 11.1A11 11 0 0119 12.5M5 12.5a11 11 0 015.2-2.9M10.7 5.1A16 16 0 0122.6 9M1.4 9a16 16 0 014.3-2.8M8.5 16a5 5 0 017 0M12 20h.01"/></svg>
  <span data-i18n="offline"></span>
</div>

<div class="banner" id="synthBanner" role="note" hidden>
  <svg viewBox="0 0 24 24"><path d="M12 9v4m0 4h.01M10.3 3.9L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/></svg>
  <span data-i18n="synth"></span>
</div>

<ol class="steps" id="steps" aria-label="steps"></ol>

<main class="layout">
  <aside class="side">
    <label class="lbl" for="inbox" data-i18n="inbox"></label>
    <select id="inbox"></select>
    <div class="lbl" data-i18n="clients"></div>
    <ul id="clients" class="clients"></ul>
  </aside>

  <section class="center">
    <div class="stage card" id="stage"></div>

    <nav class="tabs">
      <button class="tab active" data-tab="todo"><span data-i18n="tabTodo"></span> <b class="count hot" id="cntTodo"></b></button>
      <button class="tab" data-tab="done"><span data-i18n="tabDone"></span> <b class="count" id="cntDone"></b></button>
      <button class="tab" data-tab="documents"><span data-i18n="tabDocs"></span></button>
      <button class="tab" data-tab="log"><span data-i18n="tabLog"></span></button>
    </nav>

    <div id="tab-todo" class="tabpane">
      <div class="chips" id="ruleChips"></div>
      <p class="kbd muted small" data-i18n="kbd"></p>
      <div id="todoList" class="exlist"></div>
    </div>
    <div id="tab-done" class="tabpane" hidden>
      <div id="doneList" class="exlist"></div>
    </div>
    <div id="tab-documents" class="tabpane" hidden>
      <div id="docGrid" class="docgrid"></div>
    </div>
    <div id="tab-log" class="tabpane" hidden>
      <div id="logHead"></div>
      <div class="tablewrap"><table class="log" id="logTable"></table></div>
      <h3 class="ophead"><span data-i18n="opHead"></span> <small class="muted" data-i18n="opSub"></small></h3>
      <div id="opHead"></div>
      <div class="tablewrap"><table class="log" id="opTable"></table></div>
    </div>
  </section>
</main>

<dialog id="login">
  <form class="loginbox" id="loginForm">
    <h3 data-i18n="loginTitle"></h3>
    <p class="muted small" data-i18n="loginSub"></p>
    <label class="lbl" for="lgUser" data-i18n="user"></label><input id="lgUser" autocomplete="username" required>
    <label class="lbl" for="lgPass" data-i18n="password"></label><input id="lgPass" type="password" autocomplete="current-password" required>
    <p id="lgErr" class="err" hidden></p>
    <button class="btn primary" type="submit" data-i18n="signIn"></button>
  </form>
</dialog>

<dialog id="confirm" class="small-dlg">
  <form method="dialog" class="confirmbox">
    <h3 id="cfTitle"></h3>
    <div id="cfBody"></div>
    <div class="btns end">
      <button class="btn" value="cancel" data-i18n="cancel"></button>
      <button class="btn primary" value="ok" id="cfOk"></button>
    </div>
  </form>
</dialog>

<dialog id="viewer">
  <div class="viewer">
    <div class="viewer-img"><div class="imgbox" id="imgBox"><img id="viewImg" alt="voucher"></div></div>
    <div class="viewer-side">
      <div class="viewer-head"><h3 id="viewTitle"></h3><button class="x" id="closeViewer" aria-label="Close">&times;</button></div>
      <div id="viewEx"></div>
      <div id="viewDecide"></div>
      <h4 data-i18n="viewRead"></h4>
      <table class="fields" id="viewFields"></table>
      <div class="viewer-nav">
        <button class="btn" id="viewPrev" data-i18n="prev"></button>
        <span class="muted small" id="viewPos"></span>
        <button class="btn" id="viewNext" data-i18n="next"></button>
      </div>
    </div>
  </div>
</dialog>

<div class="toast" id="toast" role="alert" hidden></div>

<footer class="foot" data-i18n="foot"></footer>
<script src="static/i18n.js"></script>
<script src="static/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger Room</title>
<link rel="icon" type="image/png" sizes="16x16" href="static/brand/favicon-16.png">
<link rel="icon" type="image/png" sizes="24x24" href="static/brand/ledger-room-24.png">
<link rel="icon" type="image/png" sizes="32x32" href="static/brand/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="static/brand/ledger-room.svg">
<link rel="apple-touch-icon" sizes="180x180" href="static/brand/apple-touch-icon.png">
<link rel="stylesheet" href="static/style.css">
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Ledger Room">
    <img class="mark" src="static/brand/ledger-room.svg" alt="Ledger Room" width="32" height="32">
    <button class="rb" data-nav="queue" data-ic="inbox" data-i18n-title="navQueue" data-i18n-aria="navQueue"></button>
    <button class="rb" data-nav="documents" data-ic="grid" data-i18n-title="navDocs" data-i18n-aria="navDocs"></button>
    <button class="rb" id="navExport" data-ic="download" data-i18n-title="navExport" data-i18n-aria="navExport"></button>
    <button class="rb" data-nav="log" data-ic="history" data-i18n-title="navLog" data-i18n-aria="navLog"></button>
    <div class="sp"></div>
    <button class="rb" id="navSettings" data-ic="settings" data-i18n-title="navSettings" data-i18n-aria="navSettings" aria-haspopup="true"></button>
  </nav>

  <div class="main">
    <header class="top">
      <label class="crumb" data-i18n-title="inbox"><select id="inbox" data-i18n-aria="inbox"></select><span class="chev" data-ic="chevronDown"></span></label>
      <span class="tag" id="synthTag" data-i18n="sample" data-i18n-title="synth" hidden></span>
      <div class="sp"></div>
      <button class="status" id="statusBtn" aria-haspopup="true"><span class="dot"></span><span id="statusText"></span></button>
      <label class="search"><span data-ic="search"></span><input id="search" type="search" autocomplete="off" data-i18n-ph="search" data-i18n-aria="search"><kbd>/</kbd></label>
      <button class="ghostbtn" id="langBtn"></button>
      <button class="avatar" id="userBtn" aria-haspopup="true"></button>
    </header>

    <div class="offline" id="offline" role="status" hidden><span data-ic="wifiOff"></span><span data-i18n="offline"></span></div>

    <div class="canvas">
      <!-- overview: title, period strip, the queue, clients and the export checklist -->
      <section class="screen" id="v-queue">
        <div class="titlerow">
          <div class="grow"><h1 id="ovTitle"></h1><p id="ovSub"></p></div>
          <div class="btns" id="ovBtns"></div>
        </div>
        <div class="card period" id="periodCard"></div>
        <div class="cols">
          <div class="card queue">
            <div class="tabs">
              <button class="tab" data-qtab="todo"><span data-i18n="tabTodo"></span><span class="n" id="cntTodo"></span></button>
              <button class="tab" data-qtab="done"><span data-i18n="tabDone"></span><span class="n" id="cntDone"></span></button>
              <div class="sp"></div>
              <div class="seg" role="group">
                <button data-group="0" data-i18n="byPriority"></button>
                <button data-group="1" data-i18n="byReason"></button>
              </div>
            </div>
            <div class="tablewrap" id="qWrap"><table class="qt" id="qTable"></table></div>
          </div>
          <aside class="side">
            <div class="card clientcard"><h2 data-i18n="clients"></h2><ul class="clist" id="clients"></ul></div>
            <div class="card"><h2 data-i18n="chkHead"></h2><ul class="checks" id="checks"></ul><div class="expwrap" id="expWrap"></div></div>
          </aside>
        </div>
      </section>

      <!-- one voucher: queue, the image, the reason and the four decisions -->
      <section class="screen" id="v-review">
        <div class="rev" id="rev">
          <div class="card mini">
            <div class="hd"><button class="iconbtn" id="revBack" data-ic="arrowLeft" data-i18n-title="back" data-i18n-aria="back"></button><b id="miniHead"></b><span id="miniLeft"></span>
              <button class="iconbtn" id="miniToggle" data-ic="panelLeft" aria-controls="mini"></button></div>
            <ul id="mini"></ul>
          </div>
          <div class="viewer">
            <div class="vbar">
              <button class="iconbtn" id="zOut" data-ic="zoomOut" data-i18n-title="zoomOut" data-i18n-aria="zoomOut"></button>
              <span class="zoom" id="zLabel">100%</span>
              <button class="iconbtn" id="zIn" data-ic="zoomIn" data-i18n-title="zoomIn" data-i18n-aria="zoomIn"></button>
              <button class="iconbtn" id="zFit" data-ic="maximize" data-i18n-title="fit" data-i18n-aria="fit"></button>
              <a class="iconbtn" id="zOrig" target="_blank" rel="noopener" data-ic="external" data-i18n-title="openOriginal" data-i18n-aria="openOriginal"></a>
              <div class="sp"></div>
              <button class="toggle" id="boxToggle"></button>
              <span class="fn mono" id="viewFile"></span>
            </div>
            <div class="stagewrap" id="stage">
              <div class="paper" id="paper"><img id="viewImg" alt=""></div>
              <div class="einvcard" id="viewNoImg" hidden></div>
            </div>
          </div>
          <div class="card panel" id="panel">
            <div class="ph">
              <div class="row1"><h2 id="viewTitle"></h2><span class="tag" id="viewCid"></span>
                <div class="nav"><button class="iconbtn" id="viewPrev" data-ic="chevronLeft" data-i18n-title="kMove" aria-label="Previous"></button><span id="viewPos"></span><button class="iconbtn" id="viewNext" data-ic="chevronRight" data-i18n-title="kMove" aria-label="Next"></button></div></div>
              <div class="meta" id="viewMeta"></div>
            </div>
            <div class="pscroll" id="pscroll">
              <div class="why" id="viewEx"></div>
              <div class="read">
                <div class="lbl"><span id="readHead"></span><button class="linkbtn" id="fieldToggle"></button></div>
                <table class="fields" id="viewFields"></table>
                <p class="edithint" id="editHint"></p>
              </div>
            </div>
            <div class="decidebox" id="viewDecide"></div>
          </div>
        </div>
      </section>

      <section class="screen" id="v-documents">
        <div class="titlerow"><div class="grow"><h1 data-i18n="docsTitle"></h1><p id="docsSub"></p></div></div>
        <div class="card docscard"><div id="docGrid" class="docgrid"></div></div>
      </section>

      <section class="screen" id="v-log">
        <div class="titlerow"><div class="grow"><h1 data-i18n="logTitle"></h1></div></div>
        <div class="logcols">
          <div class="card logcard">
            <h2><span data-i18n="auditHead"></span> <small data-i18n="auditSub"></small></h2>
            <div id="logHead"></div>
            <div class="tablewrap"><table class="log" id="logTable"></table></div>
          </div>
          <div class="card logcard">
            <h2><span data-i18n="opHead"></span> <small data-i18n="opSub"></small></h2>
            <div id="opHead"></div>
            <div class="tablewrap"><table class="log" id="opTable"></table></div>
          </div>
        </div>
      </section>
    </div>

    <footer class="keybar" id="keybar"></footer>
  </div>
</div>

<div class="pop" id="statusPop" hidden></div>
<div class="pop" id="userPop" hidden></div>
<div class="pop" id="setPop" hidden></div>

<dialog id="login">
  <form class="loginbox" id="loginForm">
    <img src="static/brand/ledger-room.svg" alt="" width="40" height="40">
    <h3 data-i18n="loginTitle"></h3>
    <p class="muted" data-i18n="loginSub"></p>
    <label class="lbl" for="lgUser" data-i18n="user"></label><input id="lgUser" autocomplete="username" required>
    <label class="lbl" for="lgPass" data-i18n="password"></label><input id="lgPass" type="password" autocomplete="current-password" required>
    <p id="lgErr" class="err" hidden></p>
    <button class="btn primary" type="submit" data-i18n="signIn"></button>
  </form>
</dialog>

<dialog id="confirm">
  <form method="dialog" class="confirmbox">
    <h3 id="cfTitle"></h3>
    <div id="cfBody"></div>
    <div class="btns end">
      <button class="btn ghost" value="cancel" id="cfCancel" data-i18n="cancel"></button>
      <button class="btn primary" value="ok" id="cfOk"></button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>
<script src="static/i18n.js"></script>
<script src="static/app.js"></script>
</body>
</html>
